services:
  vscode:
    build:
      context: .
      dockerfile: Dockerfile
    image: trinity-code-server-alpine:latest
    container_name: vscode
    cpus: "${VSCODE_CPUS:-6}"
    ports:
      - "${IDE_BIND_ADDRESS:-127.0.0.1}:${IDE_PORT:-5734}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: root
    restart: always
    environment:
      # Local extension updates from official GitHub releases (seconds)
      TRINITY_AGENT_AUTO_UPDATE: "${TRINITY_AGENT_AUTO_UPDATE:-true}"
      TRINITY_AGENT_UPDATE_INTERVAL: "${TRINITY_AGENT_UPDATE_INTERVAL:-21600}"
      # Each API keeps its own endpoint, model catalogue, token limits and allowance.
      TRINITY_OVHCLOUD_BASE_URL: "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1"
      TRINITY_DEEPSEEK_BASE_URL: "${TRINITY_DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      TRINITY_OPENAI_BASE_URL: "${TRINITY_OPENAI_BASE_URL:-https://api.openai.com/v1}"
      TRINITY_OPENAI_MONTHLY_CREDIT_USD: "${TRINITY_OPENAI_MONTHLY_CREDIT_USD:-100}"
      TRINITY_AGENT_PROVIDER: "${TRINITY_AGENT_PROVIDER:-ovhcloud}"
      # Budgets auto calculés depuis les capacités du modèle ; entier = plafond explicite
      TRINITY_AGENT_CONTEXT_TOKENS: "${TRINITY_AGENT_CONTEXT_TOKENS:-auto}"
      # Marge de sécurité pour l’estimation des tokens ; ce n’est pas une allocation
      TRINITY_AGENT_CONTEXT_RESERVE_TOKENS: "${TRINITY_AGENT_CONTEXT_RESERVE_TOKENS:-4096}"
      TRINITY_AGENT_OUTPUT_TOKENS: "${TRINITY_AGENT_OUTPUT_TOKENS:-auto}"
      TRINITY_AGENT_COMPLEX_OUTPUT_TOKENS: "${TRINITY_AGENT_COMPLEX_OUTPUT_TOKENS:-auto}"
      # Emojis: 0 aucun, 1 ✅⭕➡️, 2 tous avec parcimonie, 3 expressif
      TRINITY_AGENT_EMOJI_MODE: "${TRINITY_AGENT_EMOJI_MODE:-1}"
      # Délais et nombre maximal d’étapes : protections explicites de l’exécution
      TRINITY_AGENT_TASK_CHECKPOINT_SECONDS: "${TRINITY_AGENT_TASK_CHECKPOINT_SECONDS:-300}"
      # 0 disables the model-call count ceiling.
      TRINITY_AGENT_REQUEST_LIMIT: "${TRINITY_AGENT_REQUEST_LIMIT:-0}"
      # Compaction, mémoire et résultats d’outils : budgets adaptatifs
      TRINITY_AGENT_SUMMARY_TOKENS: "${TRINITY_AGENT_SUMMARY_TOKENS:-auto}"
      TRINITY_AGENT_SUMMARY_SOURCE_CHARS: "${TRINITY_AGENT_SUMMARY_SOURCE_CHARS:-auto}"
      TRINITY_AGENT_SUMMARY_GENERATION_TOKENS: "${TRINITY_AGENT_SUMMARY_GENERATION_TOKENS:-auto}"
      TRINITY_AGENT_SUMMARY_TIMEOUT_SECONDS: "${TRINITY_AGENT_SUMMARY_TIMEOUT_SECONDS:-15}"
      TRINITY_AGENT_TOOL_OUTPUT_CHARS: "${TRINITY_AGENT_TOOL_OUTPUT_CHARS:-auto}"
      TRINITY_AGENT_AUTO_INSTALL: "${TRINITY_AGENT_AUTO_INSTALL:-project}"
      TRINITY_AGENT_INVENTORY_TTL_SECONDS: "${TRINITY_AGENT_INVENTORY_TTL_SECONDS:-300}"
      TRINITY_AGENT_MEMORY_INDEX_DIR: "${TRINITY_AGENT_MEMORY_INDEX_DIR:-/root/.cache/trinity-agent/project-memory}"
      TRINITY_AGENT_MEMORY_DOCUMENT_CHARS: "${TRINITY_AGENT_MEMORY_DOCUMENT_CHARS:-auto}"
      TRINITY_AGENT_MEMORY_SCAN_SECONDS: "${TRINITY_AGENT_MEMORY_SCAN_SECONDS:-5}"
      TRINITY_AGENT_SHARED_MEMORY_CHARS: "${TRINITY_AGENT_SHARED_MEMORY_CHARS:-auto}"
      TRINITY_AGENT_MEMORY_CHARS: "${TRINITY_AGENT_MEMORY_CHARS:-auto}"
      # Préparation locale sans appel LLM ; 0 désactive la recherche de fichiers
      TRINITY_AGENT_PREFLIGHT_CONTEXT_CHARS: "${TRINITY_AGENT_PREFLIGHT_CONTEXT_CHARS:-auto}"
      TRINITY_AGENT_PREFLIGHT_TIMEOUT_MS: "${TRINITY_AGENT_PREFLIGHT_TIMEOUT_MS:-2500}"
      # auto : CPU/affinité/quotas et mémoire disponible ; entier : plafond facultatif
      TRINITY_AGENT_PERFORMANCE_MODE: "${TRINITY_AGENT_PERFORMANCE_MODE:-max}"
      TRINITY_AGENT_RELEASE_JOBS: "${TRINITY_AGENT_RELEASE_JOBS:-3}"
      TRINITY_AGENT_PREFLIGHT_WORKERS: "${TRINITY_AGENT_PREFLIGHT_WORKERS:-auto}"
      TRINITY_AGENT_PREFLIGHT_MAX_FILES: "${TRINITY_AGENT_PREFLIGHT_MAX_FILES:-auto}"
      TRINITY_AGENT_PREFLIGHT_FILE_CHARS: "${TRINITY_AGENT_PREFLIGHT_FILE_CHARS:-auto}"
      # Caches auto selon mémoire disponible/cgroups ; entier = plafond en Mio, 0 = désactivé
      TRINITY_AGENT_RAM_CACHE_MB: "${TRINITY_AGENT_RAM_CACHE_MB:-auto}"
      TRINITY_AGENT_RAM_CACHE_ENTRIES: "${TRINITY_AGENT_RAM_CACHE_ENTRIES:-auto}"
      TRINITY_AGENT_INDEX_CACHE_MB: "${TRINITY_AGENT_INDEX_CACHE_MB:-auto}"
      TRINITY_AGENT_ARCHIVE_CACHE_MB: "${TRINITY_AGENT_ARCHIVE_CACHE_MB:-auto}"
      # Solde estimé : crédit OVH moins consommation courante, affichage au centime
      TRINITY_AGENT_BILLING_CACHE_SECONDS: "${TRINITY_AGENT_BILLING_CACHE_SECONDS:-60}"
      # Budgets de toute l’installation, périodes calendaires UTC ; 0 = illimité
      TRINITY_AGENT_BUDGET_DAILY_EUR: "${TRINITY_AGENT_BUDGET_DAILY_EUR:-2}"
      TRINITY_AGENT_BUDGET_WEEKLY_EUR: "${TRINITY_AGENT_BUDGET_WEEKLY_EUR:-15}"
      TRINITY_AGENT_BUDGET_MONTHLY_EUR: "${TRINITY_AGENT_BUDGET_MONTHLY_EUR:-60}"
      # false: masquer entièrement la bannière Conversations / Mount Point
      TRINITY_AGENT_SHOW_MOUNT_POINT: "${TRINITY_AGENT_SHOW_MOUNT_POINT:-true}"
      # auto: langue locale ; fr, de, en ou es pour imposer une langue
      # TRINITY_AGENT_LANG: "${TRINITY_AGENT_LANG:-auto}"
      # agent name
      # TRINITY_AGENT_NAME: "${TRINITY_AGENT_NAME:-TRINITY Agent}"
      # Branding color
      # TRINITY_AGENT_PRIMARY_COLOR: "${TRINITY_AGENT_PRIMARY_COLOR:-#3e3aab}"
      # Local paths inside the container; empty = default icon
      # TRINITY_AGENT_APP_ICON: "${TRINITY_AGENT_APP_ICON:-}"
      # TRINITY_AGENT_MENU_ICON: "${TRINITY_AGENT_MENU_ICON:-}"
      # TRINITY_AGENT_DARK_THEME_ICON: "${TRINITY_AGENT_DARK_THEME_ICON:-}"
    volumes:
      - ./config:/root/.config
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - type: bind
        source: ${CODEX_DATA_DIR:-./data/codex}
        target: /root/.codex
        bind:
          create_host_path: false
      - type: bind
        source: ${AGENT_DATA_DIR:-./data/agent}
        target: /root/.trinity-agent
        bind:
          create_host_path: false
      - ./project:/home/coder
      - ./extensions:/root/.local/share/code-server/extensions
      - ./user:/root/.local/share/code-server/User
      - ./ssh/.ssh:/root/.ssh
      - /:/home/coder/TRINITY-DOCKER
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - PASSWORD_VSCODE
      - TRINITY_OVHCLOUD_API_KEY
      - TRINITY_OVHCLOUD_APPLICATION_KEY
      - TRINITY_OVHCLOUD_APPLICATION_SECRET
      - TRINITY_OVHCLOUD_CONSUMER_KEY
      - TRINITY_OVHCLOUD_PROJECT
      - TRINITY_OVHCLOUD_API_BASE_URL

    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --disable-telemetry
      - --disable-update-check

secrets:
  PASSWORD_VSCODE:
    file: ${AGENT_SECRETS_DIR:-./secrets}/PASSWORD_VSCODE
  TRINITY_OVHCLOUD_API_KEY:
    file: ${AGENT_SECRETS_DIR:-./secrets}/TRINITY_OVHCLOUD_API_KEY
  TRINITY_OVHCLOUD_APPLICATION_KEY:
    file: ${AGENT_SECRETS_DIR:-./secrets}/TRINITY_OVHCLOUD_APPLICATION_KEY
  TRINITY_OVHCLOUD_APPLICATION_SECRET:
    file: ${AGENT_SECRETS_DIR:-./secrets}/TRINITY_OVHCLOUD_APPLICATION_SECRET
  TRINITY_OVHCLOUD_CONSUMER_KEY:
    file: ${AGENT_SECRETS_DIR:-./secrets}/TRINITY_OVHCLOUD_CONSUMER_KEY
  TRINITY_OVHCLOUD_PROJECT:
    file: ${AGENT_SECRETS_DIR:-./secrets}/TRINITY_OVHCLOUD_PROJECT
  TRINITY_OVHCLOUD_API_BASE_URL:
    file: ${AGENT_SECRETS_DIR:-./secrets}/TRINITY_OVHCLOUD_API_BASE_URL
