services:
  vscode:
    build:
      context: .
      dockerfile: Dockerfile
    image: trinity-code-server-alpine:latest
    container_name: vscode
    cpus: "${VSCODE_CPUS:-6}"
    ports:
      - "${IDE_BIND_ADDRESS:-127.0.0.1}:${IDE_PORT:-5734}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: root
    restart: always
    environment:
      # Local extension updates from official GitHub releases (seconds)
      OVH_AGENT_AUTO_UPDATE: "${OVH_AGENT_AUTO_UPDATE:-true}"
      OVH_AGENT_UPDATE_INTERVAL: "${OVH_AGENT_UPDATE_INTERVAL:-21600}"
      # OVH API url (or other provider)
      OVH_AI_BASE_URL: "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1"
      OVH_AGENT_PROVIDER: "${OVH_AGENT_PROVIDER:-ovhcloud}"
      # Budgets auto calculés depuis les capacités du modèle ; entier = plafond explicite
      OVH_AGENT_CONTEXT_TOKENS: "${OVH_AGENT_CONTEXT_TOKENS:-auto}"
      # Marge de sécurité pour l’estimation des tokens ; ce n’est pas une allocation
      OVH_AGENT_CONTEXT_RESERVE_TOKENS: "${OVH_AGENT_CONTEXT_RESERVE_TOKENS:-4096}"
      OVH_AGENT_OUTPUT_TOKENS: "${OVH_AGENT_OUTPUT_TOKENS:-auto}"
      OVH_AGENT_COMPLEX_OUTPUT_TOKENS: "${OVH_AGENT_COMPLEX_OUTPUT_TOKENS:-auto}"
      # Emojis: 0 aucun, 1 ✅⭕➡️, 2 tous avec parcimonie, 3 expressif
      OVH_AGENT_EMOJI_MODE: "${OVH_AGENT_EMOJI_MODE:-1}"
      # Délais et nombre maximal d’étapes : protections explicites de l’exécution
      OVH_AGENT_TASK_CHECKPOINT_SECONDS: "${OVH_AGENT_TASK_CHECKPOINT_SECONDS:-300}"
      # 0 disables the model-call count ceiling.
      OVH_AGENT_REQUEST_LIMIT: "${OVH_AGENT_REQUEST_LIMIT:-0}"
      # Compaction, mémoire et résultats d’outils : budgets adaptatifs
      OVH_AGENT_SUMMARY_TOKENS: "${OVH_AGENT_SUMMARY_TOKENS:-auto}"
      OVH_AGENT_SUMMARY_SOURCE_CHARS: "${OVH_AGENT_SUMMARY_SOURCE_CHARS:-auto}"
      OVH_AGENT_SUMMARY_GENERATION_TOKENS: "${OVH_AGENT_SUMMARY_GENERATION_TOKENS:-auto}"
      OVH_AGENT_SUMMARY_TIMEOUT_SECONDS: "${OVH_AGENT_SUMMARY_TIMEOUT_SECONDS:-15}"
      OVH_AGENT_TOOL_OUTPUT_CHARS: "${OVH_AGENT_TOOL_OUTPUT_CHARS:-auto}"
      OVH_AGENT_AUTO_INSTALL: "${OVH_AGENT_AUTO_INSTALL:-project}"
      OVH_AGENT_INVENTORY_TTL_SECONDS: "${OVH_AGENT_INVENTORY_TTL_SECONDS:-300}"
      OVH_AGENT_MEMORY_INDEX_DIR: "${OVH_AGENT_MEMORY_INDEX_DIR:-/root/.cache/ovh-agent/project-memory}"
      OVH_AGENT_MEMORY_DOCUMENT_CHARS: "${OVH_AGENT_MEMORY_DOCUMENT_CHARS:-auto}"
      OVH_AGENT_MEMORY_SCAN_SECONDS: "${OVH_AGENT_MEMORY_SCAN_SECONDS:-5}"
      OVH_AGENT_SHARED_MEMORY_CHARS: "${OVH_AGENT_SHARED_MEMORY_CHARS:-auto}"
      OVH_AGENT_MEMORY_CHARS: "${OVH_AGENT_MEMORY_CHARS:-auto}"
      # Préparation locale sans appel LLM ; 0 désactive la recherche de fichiers
      OVH_AGENT_PREFLIGHT_CONTEXT_CHARS: "${OVH_AGENT_PREFLIGHT_CONTEXT_CHARS:-auto}"
      OVH_AGENT_PREFLIGHT_TIMEOUT_MS: "${OVH_AGENT_PREFLIGHT_TIMEOUT_MS:-2500}"
      # auto : CPU/affinité/quotas et mémoire disponible ; entier : plafond facultatif
      OVH_AGENT_PERFORMANCE_MODE: "${OVH_AGENT_PERFORMANCE_MODE:-max}"
      OVH_AGENT_RELEASE_JOBS: "${OVH_AGENT_RELEASE_JOBS:-3}"
      OVH_AGENT_PREFLIGHT_WORKERS: "${OVH_AGENT_PREFLIGHT_WORKERS:-auto}"
      OVH_AGENT_PREFLIGHT_MAX_FILES: "${OVH_AGENT_PREFLIGHT_MAX_FILES:-auto}"
      OVH_AGENT_PREFLIGHT_FILE_CHARS: "${OVH_AGENT_PREFLIGHT_FILE_CHARS:-auto}"
      # Caches auto selon mémoire disponible/cgroups ; entier = plafond en Mio, 0 = désactivé
      OVH_AGENT_RAM_CACHE_MB: "${OVH_AGENT_RAM_CACHE_MB:-auto}"
      OVH_AGENT_RAM_CACHE_ENTRIES: "${OVH_AGENT_RAM_CACHE_ENTRIES:-auto}"
      OVH_AGENT_INDEX_CACHE_MB: "${OVH_AGENT_INDEX_CACHE_MB:-auto}"
      OVH_AGENT_ARCHIVE_CACHE_MB: "${OVH_AGENT_ARCHIVE_CACHE_MB:-auto}"
      # Solde estimé : crédit OVH moins consommation courante, affichage au centime
      OVH_AGENT_BILLING_CACHE_SECONDS: "${OVH_AGENT_BILLING_CACHE_SECONDS:-60}"
      # Budgets de toute l’installation, périodes calendaires UTC ; 0 = illimité
      OVH_AGENT_BUDGET_DAILY_EUR: "${OVH_AGENT_BUDGET_DAILY_EUR:-2}"
      OVH_AGENT_BUDGET_WEEKLY_EUR: "${OVH_AGENT_BUDGET_WEEKLY_EUR:-15}"
      OVH_AGENT_BUDGET_MONTHLY_EUR: "${OVH_AGENT_BUDGET_MONTHLY_EUR:-60}"
      # false: masquer entièrement la bannière Conversations / Mount Point
      OVH_AGENT_SHOW_MOUNT_POINT: "${OVH_AGENT_SHOW_MOUNT_POINT:-true}"
      # auto: langue locale ; fr, de, en ou es pour imposer une langue
      # OVH_AGENT_LANG: "${OVH_AGENT_LANG:-auto}"
      # agent name
      # OVH_AGENT_NAME: "${OVH_AGENT_NAME:-TRINITY Agent}"
      # Branding color
      # OVH_AGENT_PRIMARY_COLOR: "${OVH_AGENT_PRIMARY_COLOR:-#3e3aab}"
      # Local paths inside the container; empty = default icon
      # OVH_AGENT_APP_ICON: "${OVH_AGENT_APP_ICON:-}"
      # OVH_AGENT_MENU_ICON: "${OVH_AGENT_MENU_ICON:-}"
      # OVH_AGENT_DARK_THEME_ICON: "${OVH_AGENT_DARK_THEME_ICON:-}"
    volumes:
      - ./config:/root/.config
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - type: bind
        source: ${CODEX_DATA_DIR:-./data/codex}
        target: /root/.codex
        bind:
          create_host_path: false
      - type: bind
        source: ${AGENT_DATA_DIR:-./data/agent}
        target: /root/.ovh-agent
        bind:
          create_host_path: false
      - ./project:/home/coder
      - ./extensions:/root/.local/share/code-server/extensions
      - ./user:/root/.local/share/code-server/User
      - ./ssh/.ssh:/root/.ssh
      - /:/home/coder/TRINITY-DOCKER
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - PASSWORD_VSCODE
      - OVH_AI_API_KEY
      - OVH_APPLICATION_KEY
      - OVH_APPLICATION_SECRET
      - OVH_CONSUMER_KEY
      - OVH_CLOUD_PROJECT
      - OVH_API_BASE_URL

    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --disable-telemetry
      - --disable-update-check

secrets:
  PASSWORD_VSCODE:
    file: ${AGENT_SECRETS_DIR:-./secrets}/PASSWORD_VSCODE
  OVH_AI_API_KEY:
    file: ${AGENT_SECRETS_DIR:-./secrets}/OVH_AI_API_KEY
  OVH_APPLICATION_KEY:
    file: ${AGENT_SECRETS_DIR:-./secrets}/OVH_APPLICATION_KEY
  OVH_APPLICATION_SECRET:
    file: ${AGENT_SECRETS_DIR:-./secrets}/OVH_APPLICATION_SECRET
  OVH_CONSUMER_KEY:
    file: ${AGENT_SECRETS_DIR:-./secrets}/OVH_CONSUMER_KEY
  OVH_CLOUD_PROJECT:
    file: ${AGENT_SECRETS_DIR:-./secrets}/OVH_CLOUD_PROJECT
  OVH_API_BASE_URL:
    file: ${AGENT_SECRETS_DIR:-./secrets}/OVH_API_BASE_URL
