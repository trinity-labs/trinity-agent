name: Test, package and publish extension
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ovh-agent-extension/extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ovh-agent-extension/extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 ../../scripts/test-auto-update.py
      - run: python3 ../../scripts/test-export-public.py
      - name: Verify backend changes before packaging
        env:
          PYDANTIC_AI_NO_BANNER: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/agent-verification"
          "$RUNNER_TEMP/agent-verification/bin/pip" install 'pydantic-ai-slim[openai]==2.56.0'
          "$RUNNER_TEMP/agent-verification/bin/python" ../../scripts/check-backend.py
      - name: Measure offline backend cold and warm starts
        env:
          PYDANTIC_AI_NO_BANNER: '1'
        run: |
          "$RUNNER_TEMP/agent-verification/bin/python" ../../scripts/benchmark-performance.py --runs 1 --output "$RUNNER_TEMP/backend-performance.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-performance
          path: ${{ runner.temp }}/backend-performance.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify Marketplace authorization on manual runs
        if: github.event_name == 'workflow_dispatch' && vars.MARKETPLACE_AUTH_MODE == 'pat'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          MARKETPLACE_PUBLISHER: ${{ vars.MARKETPLACE_PUBLISHER }}
        run: |
          test -n "$VSCE_PAT" || { echo 'Missing VSCE_PAT repository secret'; exit 1; }
          npx --no-install vsce verify-pat "$MARKETPLACE_PUBLISHER"
      - name: Package reviewed files only
        env:
          MARKETPLACE_PUBLISHER: ${{ vars.MARKETPLACE_PUBLISHER }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: npm run package:vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-vsix
          path: ovh-agent-extension/extension/dist/*.vsix
          if-no-files-found: error
          retention-days: 14
  local-package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm run package:vsix
        working-directory: ovh-agent-extension/extension
        env:
          MARKETPLACE_PUBLISHER: trinity
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-extension-vsix
          path: ovh-agent-extension/extension/dist/*-local-*.vsix
          if-no-files-found: error
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, local-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-vsix
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: local-extension-vsix
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "TRINITY Agent $RELEASE_TAG" --notes 'Self-hosted TRINITY Agent client. Requires the companion Linux backend; see the installation guide. OVH API usage is billed separately.'
          fi
          gh release upload "$RELEASE_TAG" dist/*.vsix --clobber
  marketplace:
    if: startsWith(github.ref, 'refs/tags/v') && vars.MARKETPLACE_ENABLED == 'true' && vars.MARKETPLACE_PUBLISHER != ''
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-vsix
          path: dist
      - name: Connect Microsoft Entra identity
        if: vars.MARKETPLACE_AUTH_MODE != 'pat'
        uses: Azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish with federated Microsoft Entra identity
        if: vars.MARKETPLACE_AUTH_MODE != 'pat'
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath dist/*.vsix --azure-credential --skip-duplicate
      - name: Publish with configured PAT (legacy alternative)
        if: vars.MARKETPLACE_AUTH_MODE == 'pat'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT" || { echo 'Missing VSCE_PAT repository secret'; exit 1; }
          npx --yes @vscode/vsce@4.0.0 publish --packagePath dist/*.vsix --skip-duplicate
